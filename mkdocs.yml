site_name: Castellan
site_description: Least-privilege permissions for multi-agent AI systems
site_url: https://kachhadiyahiren.github.io/agent-castellan/
repo_url: https://github.com/KachhadiyaHiren/agent-castellan
repo_name: KachhadiyaHiren/agent-castellan
docs_dir: docs/site
edit_uri: edit/main/docs/site/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - Writing policies: guides/writing-policies.md
      - Multi-agent delegation: guides/delegation.md
      - Approvals: guides/approvals.md
      - Budgets: guides/budgets.md
      - Audit log: guides/audit.md
      - Integrations: guides/integrations.md
      - Testing and linting policies: guides/testing-and-linting.md
  - Reference:
      - Policy language: reference/policy-language.md
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
  - About:
      - Security model: about/security.md
      - Architecture: about/architecture.md
      - FAQ: about/faq.md
      - Glossary: about/glossary.md
