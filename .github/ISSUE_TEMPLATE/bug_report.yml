name: Bug report
description: Something behaves differently from the docs
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security vulnerability, do not open an issue: follow SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: policy
    attributes:
      label: Smallest policy that shows it
      description: A short policy YAML, ideally with the `castellan check` command or Python snippet that goes wrong.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output
      render: text
  - type: input
    id: version
    attributes:
      label: Castellan version
      placeholder: "output of: pip show agent-castellan"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
    validations:
      required: true
