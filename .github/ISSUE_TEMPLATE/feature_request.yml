name: Feature request
description: Suggest an addition or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and why current features do not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Castellan to do?
      description: A sketch of the policy syntax, CLI option or API you imagine is ideal.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to implement it?
      options: ["Yes", "Maybe, with guidance", "No"]
