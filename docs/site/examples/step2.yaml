version: 1

defaults:
  effect: deny

rules:
  - id: read-workspace
    tools: ["fs.read", "fs.list"]
    when:
      args.path: { glob: "/workspace/**" }
    effect: allow

  - id: no-secrets
    tools: ["*"]
    when:
      any:
        - args.path: { glob: "**/.env*" }
        - args.path: { glob: "**/*.pem" }
    effect: deny
    reason: Secret files are off limits
